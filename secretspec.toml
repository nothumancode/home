[project]
name = "home-manager"
revision = "1.0"

[providers.doppler]
uri = "doppler://global/dev"
credentials = { token = "bootstrap" }

# Extend configurations from subdirectories
# extends = [ "subdir1", "subdir2" ]

[profiles.default]
CACHIX_AUTH_TOKEN = { description = "Cachix Personal Auth Token", providers = ["doppler"] }
EXA_API_KEY = { description = "Exa API key", providers = ["doppler"] }
