name: Update flake.lock

on:
  schedule:
    # Mondays 05:00 UTC, so CI has built and pushed the new generation before the week starts.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            access-tokens = github.com=${{ github.token }}

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          branch: update-flake-lock
          pr-title: "Update flake.lock"

      # The pull request comes from the workflow token, which starts no `pull_request`
      # run; a dispatched run builds the update and pushes it to the cache instead.
      - name: Build the update in CI
        if: steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref update-flake-lock
