name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_agent:
        description: "Cachix agent name (main only; leave blank to check only)"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://nixpkgs-python.cachix.org
            extra-trusted-public-keys = nixpkgs-python.cachix.org-1:hxjI7pFxTyuTHn2NkvWCrAUcNZLNS3ZAvfYNuYifcEU=

      - name: Configure Cachix
        uses: cachix/cachix-action@v16
        with:
          name: thehuman
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Deploy to Cachix agent
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_agent != ''
        env:
          CACHIX_ACTIVATE_TOKEN: ${{ secrets.CACHIX_ACTIVATE_TOKEN }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          DEPLOY_AGENT: ${{ inputs.deploy_agent }}
        run: |
          : "${CACHIX_ACTIVATE_TOKEN:?Set the CACHIX_ACTIVATE_TOKEN secret to deploy}"
          : "${CACHIX_AUTH_TOKEN:?Set the CACHIX_AUTH_TOKEN secret to push}"
          spec=$(nix build --no-link --print-out-paths .#cachix-deploy)
          if ! jq -e --arg agent "$DEPLOY_AGENT" '.agents | has($agent)' "$spec" >/dev/null; then
            printf 'Agent %s is not listed in flake.nix\n' "$DEPLOY_AGENT" >&2
            exit 1
          fi
          cachix push thehuman "$spec"
          cachix deploy activate "$spec" --agent "$DEPLOY_AGENT"

  mise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Mise in a temporary home
        run: |
          export HOME="$RUNNER_TEMP/mise-bootstrap"
          mkdir -p "$HOME"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL https://mise.run/bash -o "$HOME/install.sh"
          bash "$HOME/install.sh"
          echo "MISE_BIN=$HOME/.local/bin/mise" >> "$GITHUB_ENV"
      - name: Test global install, existing files, Bash and tmux without Nix
        run: mise/test
