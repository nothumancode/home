min_version = "2026.11.14"
include = ["../shared/session.toml"]

[env]
_.path = ["{{ env.HOME }}/.local/bin"]
TWG_SKILLS_DIR = "{{env.HOME}}/.agents/skills"

[bootstrap]
dotfile_groups = ["cli"]

[settings.dotfiles]
root = "{{ mise_config_dir }}"

[dotfile_groups.cli]
root = "config"
target = "~/.config"
mode = "symlink-each"
manifest = "git"

[dotfiles]
"~/.editorconfig" = { source = "../shared/editorconfig" }
"~/.config/nvim/lua/home.lua" = { source = "../shared/nvim/home.lua" }
"~/.config/nvim/lua/dev_tools.lua" = { source = "../shared/nvim/dev_tools.lua" }
"~/.config/nvim/colors/vercel.lua" = { source = "../shared/nvim/colors/vercel.lua" }
"~/.config/tmux/home.conf" = { source = "../shared/tmux/home.conf" }
"~/.config/git/config/home-profile" = { source = "templates/git.inc.tera", template = "tera", comment = "#" }
"~/.config/git/ignore/home-profile" = { source = "../shared/git/ignore", template = "tera", comment = "#" }
"~/.config/fnox/config.toml/home-profile" = { source = "../shared/fnox/config.toml", merge = "missing" }
"~/.config/gh/config.yml/home-profile" = { source = "../shared/gh/config.yml", merge = "missing" }
"~/.config/lazygit/config.yml/home-profile" = { source = "../shared/lazygit/config.yml", merge = "missing" }
"~/.claude/settings.json/home-profile" = { source = "../shared/claude/settings.json", merge = "missing", permissions = "0600" }
"~/.codex/config.toml/home-profile" = { source = "../shared/codex/config.toml", merge = "missing", permissions = "0600" }
"~/.pi/agent/settings.json/home-profile" = { source = "../shared/pi/settings.json", merge = "missing", permissions = "0600" }
"~/.pi/agent/models.json/home-profile" = { source = "../shared/pi/models.json", merge = "missing", permissions = "0600" }
"~/.pi/agent/open-tui.json/home-profile" = { source = "../shared/pi/open-tui.json", merge = "missing", permissions = "0600" }
"~/.bashrc/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }
"~/.zshenv/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }

[bootstrap.mise_shell_activate]
bashrc = true
zshrc = true

[bootstrap.hooks]
post-tools = 'mise -C "$HOME" exec -- brain install --quiet --claude --codex --pi'

[shell_alias]
gs = "git status -sb"
gd = "git diff"
gds = "git diff --staged"
gl = "git log --oneline --graph --decorate -20"
eza = "eza --git --icons=never --group-directories-first"
ls = "eza"
ll = "eza -l"
la = "eza -a"
lt = "eza --tree"
lla = "eza -la"

[wrappers]
vi = "nvim"
vim = "nvim"
vimdiff = { command = "nvim", args = ["-d"] }

[wrappers.pi]
command = """{{ exec(command=(mise_bin | quote) ~ ' -C "$HOME" which doppler') }}"""
args = [
  "run", "-p", "vault", "-c", "prd",
  "--only-secrets", "LOGGLY_API_TOKEN", "--only-secrets", "LOGGLY_SUBDOMAIN",
  "--only-secrets", "EXA_API_KEY", "--only-secrets", "AI_GATEWAY_API_KEY",
  "--", """{{ exec(command=(mise_bin | quote) ~ ' -C "$HOME" which pi') }}""",
]

[wrappers.twg]
command = """{{ exec(command=(mise_bin | quote) ~ ' -C "$HOME" which doppler') }}"""
args = [
  "run", "-p", "vault", "-c", "prd",
  "--only-secrets", "TWG_USER", "--only-secrets", "TWG_SITE", "--only-secrets", "TWG_TOKEN",
  "--", """{{ exec(command=(mise_bin | quote) ~ ' -C "$HOME" which twg') }}""",
]

[[hooks.enter]]
shell = "bash"
script = '[[ -n ${__home_shell_loaded:-} ]] || source {{ mise_config_dir | quote }}/shell/interactive.sh'

[[hooks.enter]]
shell = "zsh"
script = '[[ -n ${__home_shell_loaded:-} ]] || source {{ mise_config_dir | quote }}/shell/interactive.sh'

[tasks.home-github-auth]
description = "Log gh into github.com from Doppler (use -E enterprise for the work host)"
shell = "bash -o pipefail -c"
env.LOGIN_HOST = "{{ vars.github_host }}"
env.LOGIN_SECRET = "{{ vars.github_token_name }}"
run = '''
doppler secrets get "$LOGIN_SECRET" -p vault -c prd --plain --no-check-version |
  env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN \
    gh auth login --hostname "$LOGIN_HOST" --git-protocol https --with-token
'''

[vars]
github_host = "github.com"
github_token_name = "GITHUB_TOKEN"

[tasks.home-parsers]
description = "Build the editor's Tree-sitter parsers (requires Git and a C compiler)"
run = """nvim --headless '+lua require("home_parsers")()' +qa"""
