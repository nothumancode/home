[vars]
github_host = "{{ get_env(name='GITHUB_ENTERPRISE_HOST') }}"
github_token_name = "GITHUB_ENTERPRISE_TOKEN"

[dotfiles]
"~/.config/git/enterprise.gitconfig/home-enterprise" = { source = "templates/enterprise.gitconfig.tera", template = "tera", comment = "#" }
"~/.config/git/enterprise-identity.gitconfig/home-identity" = { source = "templates/identity.gitconfig.tera", template = "tera", comment = "#" }
