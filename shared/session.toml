[env]
EDITOR = "nvim"
VISUAL = "nvim"
PAGER = "less"
LESS = "-FRX"
NODE_USE_SYSTEM_CA = "1"
UV_SYSTEM_CERTS = "true"
DOPPLER_PROJECT = "vault"
DOPPLER_CONFIG = "prd"
FZF_DEFAULT_COMMAND = "fd --type f --hidden --follow --exclude .git"
FZF_DEFAULT_OPTS = "--height=40% --layout=reverse --border=rounded --info=inline-right"
FZF_CTRL_T_COMMAND = "fd --type f --hidden --follow --exclude .git"
FZF_CTRL_T_OPTS = "--preview 'bat --color=always --style=numbers --line-range=:200 {} 2>/dev/null'"
FZF_ALT_C_COMMAND = "fd --type d --hidden --follow --exclude .git"
FZF_ALT_C_OPTS = "--preview 'eza --tree --level=2 --color=always --icons=never {} 2>/dev/null'"
